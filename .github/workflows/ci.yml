name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Privacy scan
        run: python tools/privacy_scan.py
      - name: Python syntax
        run: python -c 'import ast,pathlib; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in pathlib.Path(".").rglob("*.py")]'
      - name: Shell syntax
        run: bash -n install.sh
      - name: Skill references exist
        run: |
          python - <<'PY'
          import pathlib, re, sys
          skill = pathlib.Path("civil-litigation")
          text = "".join(p.read_text(encoding="utf-8") for p in skill.rglob("*.md"))
          missing = [r for r in sorted(set(re.findall(r"`((?:references|scripts)/[^`\s]+)`", text)))
                     if not (skill / r).exists()]
          print("missing:", missing or "none")
          sys.exit(1 if missing else 0)
          PY
      - name: Script dependencies import
        run: |
          python -m pip install --requirement requirements.txt
          python -c "import ast,sys; ast.parse(open('civil-litigation/scripts/build_evidence_pdf.py').read())"
          python civil-litigation/scripts/check_docx_format.py --help
